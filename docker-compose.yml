services:
  iot-panel:
    build: .
    ports:
      - "8002:8002"
    environment:
      BASE_URL: ${BASE_URL:-http://localhost:8002}
      ROOT_PATH: ${ROOT_PATH:-}
      DATABASE_URL: ${DATABASE_URL}
      ADMIN_TOKEN: ${ADMIN_TOKEN}
      SECRET_KEY: ${SECRET_KEY}
      APP_DB_PATH: /data/iot.db
      PORT: "8002"
      AD_PLAYLIST_URLS: ${AD_PLAYLIST_URLS:-}
      GTFS_LOCAL_DIR: ${GTFS_LOCAL_DIR:-}
    volumes:
      - iot_data:/data
    restart: unless-stopped

volumes:
  iot_data:
