services:
  iot-panel:
    build: .
    ports:
      - "8000:8000"
    environment:
      BASE_URL: ${BASE_URL:-http://localhost:8000}
      DATABASE_URL: ${DATABASE_URL}
      ADMIN_TOKEN: ${ADMIN_TOKEN}
      SECRET_KEY: ${SECRET_KEY}
      APP_DB_PATH: /data/iot.db
      AD_PLAYLIST_URLS: ${AD_PLAYLIST_URLS:-}
    volumes:
      - iot_data:/data
    restart: unless-stopped

volumes:
  iot_data:
