<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>GoWayki IoT</title>
  <style>
    :root { --bg:#0b1220; --fg:#e8eef9; --muted:#93a4bf; --accent:#22d3ee; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; font-family: "Segoe UI", system-ui, sans-serif;
      background: radial-gradient(1200px 600px at 10% -10%, #123055, transparent),
                  radial-gradient(900px 500px at 100% 0%, #0f3d3a, transparent), var(--bg);
      color: var(--fg); display: grid; place-items: center; padding: 2rem;
    }
    main { max-width: 36rem; width: 100%; }
    h1 { font-size: 2rem; margin: 0 0 .5rem; letter-spacing: -.02em; }
    p { color: var(--muted); line-height: 1.5; }
    a {
      display: inline-block; margin-top: 1rem; padding: .75rem 1.1rem;
      background: var(--accent); color: #04212a; text-decoration: none;
      font-weight: 700; border-radius: .5rem;
    }
  </style>
</head>
<body>
  <main>
    <h1>GoWayki IoT</h1>
    <p>Panel de quioscos y dispositivos de paradero. La tablet Flutter se vincula con un código de 6 dígitos y muestra la página del paradero.</p>
    <p style="margin-top:1.25rem;font-size:.95rem">Raspberry Pi — instalar agente:</p>
    <pre style="background:#061018;padding:.9rem 1rem;border-radius:.5rem;overflow:auto;font-size:.8rem;color:#cfe8f5">curl -fsSL {{ base_url }}/pi/install.sh | sudo bash</pre>
    <a href="{{ root_path }}/admin">Abrir panel admin</a>
  </main>
</body>
</html>
