<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Consola remota — GoWayki</title>
  <style>
    :root {
      --bg: #0b1220;
      --panel: #121a2b;
      --fg: #e8eef9;
      --muted: #93a4bf;
      --accent: #22d3ee;
      --danger: #f87171;
      --ok: #4ade80;
      --line: #243049;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; color: var(--fg);
      font-family: "Cascadia Code", "JetBrains Mono", Consolas, monospace;
      background:
        radial-gradient(900px 500px at 0% -10%, #12305555, transparent),
        radial-gradient(700px 400px at 100% 0%, #0f3d3a44, transparent),
        var(--bg);
    }
    header {
      display: flex; flex-wrap: wrap; gap: .75rem; align-items: center;
      justify-content: space-between; padding: 1rem 1.25rem;
      border-bottom: 1px solid var(--line); background: #0a101acc;
      backdrop-filter: blur(8px); position: sticky; top: 0; z-index: 5;
    }
    h1 { margin: 0; font-size: 1.05rem; font-weight: 700; letter-spacing: -.01em; }
    .meta { color: var(--muted); font-size: .8rem; }
    .badge {
      display: inline-block; padding: .15rem .5rem; border-radius: .35rem;
      font-size: .72rem; border: 1px solid var(--line);
    }
    .badge.on { color: var(--ok); border-color: #166534; background: #052e16; }
    .badge.off { color: var(--danger); border-color: #7f1d1d; background: #450a0a; }
    main { max-width: 960px; margin: 0 auto; padding: 1.25rem; }
    .login, .shell {
      background: var(--panel); border: 1px solid var(--line);
      border-radius: .75rem; padding: 1rem;
    }
    label { display: block; color: var(--muted); font-size: .75rem; margin-bottom: .35rem; }
    input[type="password"], input[type="text"], textarea {
      width: 100%; background: #0b1220; color: var(--fg);
      border: 1px solid var(--line); border-radius: .45rem;
      padding: .7rem .8rem; font: inherit;
    }
    textarea { min-height: 4.5rem; resize: vertical; }
    button {
      margin-top: .75rem; background: var(--accent); color: #04212a;
      border: 0; border-radius: .45rem; padding: .65rem 1rem;
      font-weight: 700; cursor: pointer; font-family: inherit;
    }
    button.secondary { background: transparent; color: var(--fg); border: 1px solid var(--line); }
    button:disabled { opacity: .5; cursor: wait; }
    .row { display: flex; gap: .5rem; flex-wrap: wrap; align-items: center; }
    .out {
      margin-top: 1rem; background: #060b14; border: 1px solid var(--line);
      border-radius: .55rem; padding: .9rem 1rem; min-height: 14rem;
      white-space: pre-wrap; word-break: break-word; font-size: .82rem;
      line-height: 1.45; color: #cfe8f5;
    }
    .hint { color: var(--muted); font-size: .78rem; margin: .5rem 0 0; }
    .quick { display: flex; flex-wrap: wrap; gap: .4rem; margin-top: .6rem; }
    .quick button {
      margin: 0; padding: .35rem .6rem; font-size: .72rem; font-weight: 600;
      background: #1a2438; color: var(--fg); border: 1px solid var(--line);
    }
    a { color: var(--accent); }
    .hidden { display: none !important; }
  </style>
</head>
<body>
  <header>
    <div>
      <h1>Consola remota · <span id="dev-name">…</span></h1>
      <div class="meta"><span id="dev-id"></span></div>
    </div>
    <div class="row">
      <span id="badge-online" class="badge off">offline</span>
      <span id="badge-mqtt" class="badge off">mqtt off</span>
      <a href="{{ root_path }}/admin">← Admin</a>
    </div>
  </header>

  <main>
    <section id="login" class="login">
      <label>Admin token</label>
      <input id="token" type="password" placeholder="X-Admin-Token" />
      <button id="login-btn">Entrar</button>
      <p class="hint">Misma clave que /admin. La consola encola comandos shell en la Pi por HTTP (sin MQTT).</p>
    </section>

    <section id="shell" class="shell hidden">
      <label>Comando shell (usuario gowayki_user)</label>
      <textarea id="cmd" placeholder="uname -a && hostname && df -h /"></textarea>
      <div class="quick">
        <button type="button" data-q="uname -a; hostname; uptime">sysinfo</button>
        <button type="button" data-q="journalctl -u gowayki-pi -n 40 --no-pager">logs agente</button>
        <button type="button" data-q="cat /etc/gowayki/agent.env">agent.env</button>
        <button type="button" data-q="curl -fsSL {{ base_url }}/pi/main.py -o /opt/gowayki-pi/main.py && systemctl restart gowayki-pi && echo UPGRADED">upgrade agente</button>
        <button type="button" data-q="free -h; df -h /">mem/disk</button>
      </div>
      <div class="row">
        <button id="run-btn">Ejecutar</button>
        <button class="secondary" id="refresh-btn" type="button">Actualizar estado</button>
      </div>
      <p class="hint" id="status-line">Listo.</p>
      <div class="out" id="out">$ _</div>
    </section>
  </main>

  <script>
    const DEVICE_ID = {{ device_id | tojson }};
    const BASE = {{ base_url | tojson }};
    const ROOT = {{ root_path|tojson }};
    const u = (path) => ROOT + path;
    const TOKEN_KEY = "gowayki_admin_token";
    let token = localStorage.getItem(TOKEN_KEY) || "";

    const $ = (id) => document.getElementById(id);

    async function api(path, opts = {}) {
      const headers = Object.assign({ Accept: "application/json" }, opts.headers || {});
      if (token) headers["X-Admin-Token"] = token;
      if (opts.body) headers["Content-Type"] = "application/json";
      const res = await fetch(u(path), { ...opts, headers });
      if (res.status === 401) throw new Error("Token inválido");
      const text = await res.text();
      let data = null;
      try { data = text ? JSON.parse(text) : null; } catch { data = text; }
      if (!res.ok) throw new Error((data && data.detail) || text || res.statusText);
      return data;
    }

    function showApp(ok) {
      $("login").classList.toggle("hidden", ok);
      $("shell").classList.toggle("hidden", !ok);
    }

    async function refreshDevice() {
      const list = await api("/api/admin/devices");
      const d = list.find((x) => x.id === DEVICE_ID);
      if (!d) throw new Error("Dispositivo no encontrado");
      $("dev-name").textContent = d.name || DEVICE_ID;
      $("dev-id").textContent = d.id;
      $("badge-online").textContent = d.online ? "online" : "offline";
      $("badge-online").className = "badge " + (d.online ? "on" : "off");
      $("badge-mqtt").textContent = d.mqtt_online ? "mqtt on" : "mqtt off";
      $("badge-mqtt").className = "badge " + (d.mqtt_online ? "on" : "off");
      return d;
    }

    async function login() {
      token = $("token").value.trim();
      if (!token) return alert("Token requerido");
      localStorage.setItem(TOKEN_KEY, token);
      await refreshDevice();
      showApp(true);
    }

    async function runCmd(command) {
      const cmd = (command || $("cmd").value).trim();
      if (!cmd) return;
      $("run-btn").disabled = true;
      $("status-line").textContent = "Encolando…";
      $("out").textContent = `$ ${cmd}\n… esperando a la Pi (poll HTTP cada ~3s)`;
      try {
        const job = await api(`/api/admin/devices/${DEVICE_ID}/exec`, {
          method: "POST",
          body: JSON.stringify({ command: cmd, timeout_sec: 60 }),
        });
        const started = Date.now();
        while (Date.now() - started < 90000) {
          await new Promise((r) => setTimeout(r, 1500));
          const j = await api(`/api/admin/jobs/${job.id}`);
          $("status-line").textContent = `Job ${j.id} · ${j.status}`;
          if (j.status === "done" || j.status === "error" || j.status === "timeout") {
            const parts = [
              `$ ${cmd}`,
              `exit=${j.exit_code} status=${j.status}`,
              j.stdout || "",
              j.stderr ? `\n[stderr]\n${j.stderr}` : "",
            ];
            $("out").textContent = parts.filter(Boolean).join("\n");
            return;
          }
        }
        $("out").textContent += "\n\nTimeout esperando resultado. ¿Actualizaste el agente en la Pi?";
      } catch (e) {
        $("out").textContent = String(e.message || e);
      } finally {
        $("run-btn").disabled = false;
        refreshDevice().catch(() => {});
      }
    }

    $("login-btn").addEventListener("click", () => login().catch((e) => alert(e.message)));
    $("token").addEventListener("keydown", (e) => { if (e.key === "Enter") login().catch((err) => alert(err.message)); });
    $("run-btn").addEventListener("click", () => runCmd());
    $("refresh-btn").addEventListener("click", () => refreshDevice().catch((e) => alert(e.message)));
    document.querySelector(".quick").addEventListener("click", (e) => {
      const btn = e.target.closest("button[data-q]");
      if (!btn) return;
      $("cmd").value = btn.dataset.q;
      runCmd(btn.dataset.q);
    });

    if (token) {
      $("token").value = token;
      login().catch(() => showApp(false));
    }
  </script>
</body>
</html>
